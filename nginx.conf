server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # The HTML entry document (served here and via the SPA fallback) has a
        # stable name and references the un-hashed entry bundles below, so it
        # must be revalidated -- otherwise a new deploy is not picked up until
        # the browser cache expires (or a hard reload). no-cache keeps the bytes
        # but forces an ETag revalidation first (cheap 304 when unchanged).
        add_header Cache-Control "no-cache";

        # Content-addressed assets: webpack emits these under static/ with a
        # content hash in the filename (see assetModuleFilename in
        # webpack.config.js), so the name changes whenever the bytes do. Safe to
        # cache immutably for a year. ^~ so a hashed .js/.css under static/ wins
        # over the regex rule below and is NOT downgraded to no-cache.
        location ^~ /static/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Root bundles (gui.js, player.js, blocksonly.js, ... and any split
        # chunks) keep a STABLE name across deploys -- they are not content
        # hashed. Long-caching them served a stale editor after every deploy
        # until a hard reload; revalidate instead (304 when unchanged).
        location ~* \.(js|css)$ {
            add_header Cache-Control "no-cache";
        }
    }

    # Health check endpoint.
    location /health {
        return 200 'healthy';
        add_header Content-Type text/plain;
    }
}
