server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # Long-cache the hashed static assets Scratch ships (bundles, media,
        # fonts, microbit firmware, sounds).
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|hex|wav|mp3|ttf|woff|woff2)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # Health check endpoint.
    location /health {
        return 200 'healthy';
        add_header Content-Type text/plain;
    }
}
